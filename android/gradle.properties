# === MEMORIA (conservador para 5.7 GB de RAM total) ===
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# === NO USAR DEMONIO DE KOTLIN (confirmado que se cae con poca RAM) ===
kotlin.daemon.enabled=false
kotlin.daemon.jvmargs=-Xmx768m

# === SIN PARALELISMO (con 5.7GB, procesos simultáneos = riesgo de crash) ===
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configureondemand=true

# === COMPATIBILIDAD ===
android.useAndroidX=true
android.enableJetifier=true
android.builtInKotlin=false

# === CACHÉ INCREMENTAL ACTIVADA (es en disco, no consume RAM extra, y SÍ acelera) ===
kotlin.incremental=true
kotlin.caching.enabled=true

# === TODO EN D: ===
systemProp.java.io.tmpdir=D:/INTERFACES_UNIV/Emprende/.gradle-tmp

# === SUPRIMIR AVISOS ===
org.gradle.logging.level=quiet
org.gradle.warning.mode=none
android.newDsl=false